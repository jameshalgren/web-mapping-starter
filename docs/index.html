<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Web Map</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --accent: #2a78d6; --accent-wash: rgba(42,120,214,0.10);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --accent: #3987e5; --accent-wash: rgba(57,135,229,0.14);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
nav.top { display: flex; gap: 16px; align-items: center; padding: 10px 16px;
  background: var(--surface); border-bottom: 1px solid var(--grid); }
nav.top .title { font-weight: 650; }
nav.top .badge { font-size: 11px; padding: 1px 6px; border-radius: 4px;
  border: 1px solid var(--grid); color: var(--ink2); }
nav.top .spacer { margin-left: auto; }
button.btn { padding: 5px 10px; border-radius: 6px; border: 1px solid var(--grid);
  background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; }
button.btn:hover { border-color: var(--accent); }
main { flex: 1; min-height: 0; display: grid; gap: 12px; padding: 12px 16px 16px;
  grid-template-columns: minmax(0, 3fr) minmax(280px, 1fr); }
@media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 60vh auto; } }
.panel { background: var(--surface); border: 1px solid var(--grid); border-radius: 8px; overflow: hidden; }
#map { height: 100%; min-height: 360px; }
aside { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
aside .panel { padding: 0; }
.panel h3 { margin: 0; padding: 10px 12px 4px; font-size: 14px; font-weight: 650; }
.panel .body { padding: 4px 12px 12px; color: var(--ink2); font-size: 13px; }
#notes { flex: 1; overflow: auto; }
#notes .body { color: var(--ink); }
.legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; }
.placeholder { color: var(--muted); }
.maplibregl-popup-content { background: var(--surface); color: var(--ink); font: 12px/1.4 system-ui, sans-serif; }
</style>
</head>
<body>

<nav class="top">
  <span class="title">My Web Map</span>
  <span class="badge">AI-assisted · starter</span>
  <span class="spacer"></span>
  <button class="btn" id="proj" type="button">Switch to globe</button>
</nav>

<main>
  <div class="panel"><div id="map"></div></div>

  <aside>
    <section class="panel" id="legend">
      <h3>Legend</h3>
      <div class="body" id="legend-body">
        <div class="placeholder">Your legend goes here.</div>
      </div>
    </section>

    <section class="panel" id="notes">
      <h3>About this map</h3>
      <div class="body">
        <p>Put text and other information here to explain your map.</p>
        <p class="placeholder">Title · Your name · Data source</p>
      </div>
    </section>
  </aside>
</main>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script>
// ---------------------------------------------------------------
// STARTER MAP: a global Web Mercator basemap, nothing else.
// Paths are RELATIVE (e.g. "data.geojson"), so this works from
// any folder: a CAEDM www folder, a GitHub Pages repo, or localhost.
// ---------------------------------------------------------------
const darkMode = () => window.matchMedia("(prefers-color-scheme: dark)").matches;
const styleUrl = () => darkMode()
  ? "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json"
  : "https://tiles.openfreemap.org/styles/positron";

const map = new maplibregl.Map({
  container: "map",
  style: styleUrl(),
  center: [0, 20],
  zoom: 1.4,
  attributionControl: { compact: true }
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-right");
map.addControl(new maplibregl.ScaleControl(), "bottom-left");

// Flat <-> globe toggle
let globe = false;
document.getElementById("proj").addEventListener("click", (e) => {
  globe = !globe;
  map.setProjection({ type: globe ? "globe" : "mercator" });
  e.target.textContent = globe ? "Switch to flat map" : "Switch to globe";
});

// Follow the OS light/dark setting. Changing the style removes any layers you
// added, so put your layer code in addMyLayers() and it is re-run for you.
function addMyLayers() {
  // ===== YOUR CODE GOES HERE (ask your AI assistant) =====
  // Example of what the AI will help you write:
  //   fetch("data.geojson").then(r => r.json()).then(data => {
  //     map.addSource("mine", { type: "geojson", data });
  //     map.addLayer({ id: "mine", type: "circle", source: "mine",
  //                    paint: { "circle-color": "#2a78d6", "circle-radius": 5 } });
  //   });
  // ========================================================
}
map.on("style.load", addMyLayers);
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => map.setStyle(styleUrl()));
</script>
</body>
</html>
